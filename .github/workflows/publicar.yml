# Publica o site no GitHub Pages e atualiza as datas ocupadas a cada 3 horas.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas (horario UTC)
  workflow_dispatch:          # botao "Run workflow" para atualizar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ler os calendarios do Airbnb, Booking e Vrbo
        env:
          ICAL_LINKS: ${{ secrets.ICAL_LINKS }}
        run: python3 scripts/sincronizar.py

      - name: Guardar as datas novas no repositorio (so quando mudam)
        run: |
          if git diff --quiet -I 'atualizado:' -- disponibilidade.js; then
            echo "Nenhuma data mudou."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add disponibilidade.js
            git commit -m "Atualiza datas ocupadas"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
